[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwpctl"
version = "0.2.1"
description = "Local MCP/CLI bridge that lets AI coding agents edit an open Hancom Office Hangul 2022 document (한/글 2022 라이브 편집 브리지)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jasujung99" }]
keywords = ["hangul", "hancom", "hwp", "hwpx", "mcp", "mcp-server", "win32com", "claude-code", "codex"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "mcp>=1.9,<2",
    "anyio>=4.5",
    "starlette>=0.38",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
windows = [
    "pywin32>=306",
]
# 선택: 창을 고정하기 전 연결(open --new 등)에서만 쓰인다. 검증 기준 백엔드는 win32com.
pyhwpx = [
    "pyhwpx>=1.0",
]
hwpx = [
    "python-hwpx>=6.3,<7",
]
dev = [
    "pytest>=8",
    "python-hwpx>=6.3,<7",
]

[project.scripts]
hwpctl = "hwpctl.cli:main"

[project.urls]
Homepage = "https://github.com/Jasujung99/hwpctl"
Repository = "https://github.com/Jasujung99/hwpctl"
Documentation = "https://github.com/Jasujung99/hwpctl/blob/main/docs/README.md"
Issues = "https://github.com/Jasujung99/hwpctl/issues"
Changelog = "https://github.com/Jasujung99/hwpctl/blob/main/CHANGELOG.md"
"pyhwpx documentation" = "https://martiniifun.github.io/pyhwpx/core.html"
"python-hwpx documentation" = "https://airmang.github.io/python-hwpx/"

[tool.setuptools.packages.find]
include = ["hwpctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

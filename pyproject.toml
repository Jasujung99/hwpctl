[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwpctl"
version = "0.1.0"
description = "한/글(HWP) 라이브 코파일럿 브리지 — CLI + MCP, 단일 작성기"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "hwpctl" }]
keywords = ["hangul", "hwp", "hwpx", "mcp", "pyhwpx"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "mcp>=1.9,<2",
    "anyio>=4.5",
    "starlette>=0.38",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
windows = [
    "pyhwpx>=1.0",
    "pywin32>=306",
]
dev = [
    "pytest>=8",
]

[project.scripts]
hwpctl = "hwpctl.cli:main"

[project.urls]
Homepage = "https://github.com/Jasujung99/hwpctl"
Repository = "https://github.com/Jasujung99/hwpctl"
Documentation = "https://github.com/Jasujung99/hwpctl#readme"
Issues = "https://github.com/Jasujung99/hwpctl/issues"
Changelog = "https://github.com/Jasujung99/hwpctl/blob/main/CHANGELOG.md"
"pyhwpx documentation" = "https://martiniifun.github.io/pyhwpx/core.html"

[tool.setuptools.packages.find]
include = ["hwpctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

name: Release

# `v*` 태그를 푸시하면 Windows에서 테스트·빌드한 뒤 GitHub Release를 만들고
# wheel·sdist를 첨부한다. 한/글 실기 검증은 docs/dev/RELEASE_CHECKLIST.md에 따라
# 태그 전에 사람이 확인한다.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        shell: bash
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          module=$(python -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('hwpctl/__init__.py', encoding='utf-8').read()).group(1))")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ] || [ "${module}" != "${version}" ]; then
            echo "tag ${GITHUB_REF_NAME}, pyproject ${version} and hwpctl.__version__ ${module} must match" >&2
            exit 1
          fi

      - name: Install, test and validate
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev,windows]"
          python -m pytest
          python scripts/validate_public_files.py
          python -m hwpctl mcp --list-tools

      - name: Build wheel and source distribution
        run: python -m build

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: python scripts/release_notes.py "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "${GITHUB_REF_NAME}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "hwpctl ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag ${prerelease}
